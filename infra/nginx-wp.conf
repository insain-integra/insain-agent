# Виртуальный хост WordPress: insain.ru → PHP-FPM (без Apache).
#
# Установка на VDS:
#   sudo cp /opt/insain-agent/infra/nginx-wp.conf /etc/nginx/sites-available/insain.ru
#   # Подставь ПУБЛИЧНЫЙ_IP (из cat /etc/nginx/listen.conf или curl -4 ifconfig.me)
#   # и версию php-fpm.sock (из ls /run/php/)
#   sudo nano /etc/nginx/sites-available/insain.ru
#   sudo ln -sf /etc/nginx/sites-available/insain.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL Let's Encrypt (после того как DNS A-запись указывает на этот сервер):
#   sudo certbot --nginx -d insain.ru -d www.insain.ru
#
# .htaccess не работает с nginx. ЧПУ WordPress покрыты try_files ниже.
# Дополнительные правила (редиректы, защита) добавляй в этот файл.

server {
    # Подставь публичный IP VDS (п. 3.0.3 инструкции)
    listen ПУБЛИЧНЫЙ_IP:80;
    server_name insain.ru www.insain.ru;
    root /var/www/insain.ru;
    index index.php;

    access_log /var/log/nginx/insain.ru.access.log;
    error_log  /var/log/nginx/insain.ru.error.log;

    client_max_body_size 64m;

    # ЧПУ WordPress (замена .htaccess RewriteRule)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Подставь версию PHP-FPM (ls /run/php/)
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # Запрет доступа к скрытым файлам (.htaccess, .git и т.д.)
    location ~ /\. {
        deny all;
    }
}
