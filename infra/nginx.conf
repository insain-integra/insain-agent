# Reverse proxy: calc.insain.ru → calc-api (Docker/uwsgi на 127.0.0.1:8001).
#
# Установка (Debian/Ubuntu):
#   sudo cp /path/to/insain-agent/infra/nginx.conf /etc/nginx/sites-available/calc.insain.ru
#   sudo ln -sf /etc/nginx/sites-available/calc.insain.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL Let's Encrypt (после того как DNS A-запись указывает на этот сервер):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d calc.insain.ru
# Certbot сам добавит listen 443 и сертификаты (или предложит правки в этот файл).
#
# CORS настраивается в FastAPI (calc_service/main.py), не дублируем заголовки в nginx.

server {
    # На VDS NetAngels заменить на: listen ПУБЛИЧНЫЙ_IP:80;
    # (IP из cat /etc/nginx/listen.conf, см. п. 3.0.3 инструкции)
    listen 80;
    listen [::]:80;
    server_name calc.insain.ru;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
