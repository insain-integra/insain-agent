# Порт и SITE_URL как у работающего insain-calc-api (docker inspect).
# Это содержимое бывшего /opt/insain-agent/docker-compose.calc-vds.yml.
# Сам контейнер поднят не этим override, а docker-compose.calc-only.yml:
#   docker compose -f docker-compose.calc-only.yml up -d --build

services:
  calc-api:
    ports:
      - "127.0.0.1:8002:8001"
    environment:
      SITE_URL: http://test.insain.ru
