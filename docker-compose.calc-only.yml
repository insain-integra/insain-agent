# VDS: только calc-api. Рабочий контейнер insain-calc-api создан этим файлом
# (label com.docker.compose.project.config_files).
# Порт, volume и healthcheck совпадают с docker inspect.
# Команда процесса — CMD образа: uvicorn main:app --host 0.0.0.0 --port 8001.
# SITE_URL=https://insain.ru — префикс share_url. В уже запущенном контейнере
# может оставаться прежнее значение, пока контейнер не пересоздадут.
#
# Запуск:
#   cd /opt/insain-agent
#   docker compose -f docker-compose.calc-only.yml up -d --build

services:
  calc-api:
    build:
      context: ./calc_service
      dockerfile: Dockerfile
    container_name: insain-calc-api
    ports:
      - "127.0.0.1:8002:8001"
    volumes:
      - ./calc_service/data:/app/calc_service/data
    environment:
      SITE_URL: https://insain.ru
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/calculators', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
